name: Build Android APK & Deploy

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  KEYSTORE_PASSWORD: cauleapp123
  KEY_PASSWORD: cauleapp123

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Decode keystore
        run: |
          cat android/app/caule-release.keystore.base64 | base64 -d > android/app/caule-release.keystore
      - name: Extract version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "VERSION_NAME=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"
          # Atualiza src/version.ts com a versão do build
          echo "export const APP_VERSION = '$VERSION';" > src/version.ts
          cat src/version.ts
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Sync Android
        run: npx cap sync android
      - name: Make gradlew executable
        working-directory: ./android
        run: chmod +x gradlew
      - name: Build APK (release - signed)
        working-directory: ./android
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: ./gradlew assembleRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: caule-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          body: |
            Nova versão do Caule disponível!
            
            Para instalar:
            1. Baixe o APK
            2. Ative "Fontes desconhecidas" no Android
            3. Instale o APK (atualiza automaticamente se já tiver o app instalado)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}