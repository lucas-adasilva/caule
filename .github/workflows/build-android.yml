name: Build Android APK & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Sync Android
        run: npx cap sync android
      - name: Make gradlew executable
        working-directory: ./android
        run: chmod +x gradlew
      - name: Build APK
        working-directory: ./android
        run: ./gradlew assembleRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: caule-apk
          path: android/app/build/outputs/apk/release/*.apk

  firebase-distribution:
    needs: build-android
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: caule-apk
          path: ./apk
      - name: Find APK file
        id: find-apk
        run: |
          APK_PATH=$(ls ./apk/*.apk | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Create service account file
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > service-account.json
      - name: Upload to Firebase App Distribution
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=service-account.json
          firebase appdistribution:distribute ${{ steps.find-apk.outputs.apk_path }} \
            --app ${{ secrets.FIREBASE_ANDROID_APP_ID }} \
            --groups testers \
            --release-notes "Nova versão disponível! Commit: ${{ github.sha }}"
      - name: Cleanup
        run: rm -f service-account.json