name: Build iOS IPA

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      - name: Add iOS platform (if not exists)
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync iOS
        run: npx cap sync ios

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build iOS (unsigned, for CI/testing)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Export IPA (unsigned)
        run: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportPath $RUNNER_TEMP/ipa \
            -exportOptionsPlist ios/App/exportOptions.plist \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: caule-ios-unsigned
          path: $RUNNER_TEMP/ipa/*.ipa

      - name: Create unsigned .ipa manually (fallback)
        run: |
          mkdir -p $RUNNER_TEMP/ipa
          cd $RUNNER_TEMP/App.xcarchive/Products/Applications
          if [ -d "App.app" ]; then
            mkdir -p Payload
            cp -R App.app Payload/
            zip -r $RUNNER_TEMP/ipa/Caule-unsigned.ipa Payload
            rm -rf Payload
          fi

      - name: Upload IPA (manual fallback)
        uses: actions/upload-artifact@v4
        with:
          name: caule-ios-ipa
          path: $RUNNER_TEMP/ipa/*.ipa
